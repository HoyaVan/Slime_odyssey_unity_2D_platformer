# Upstream backend server
upstream backend {
    server localhost:3000;  # Adjust port if your app.js uses a different port
    keepalive 64;
}

server {
    listen 80;
    server_name _;  # Replace with your domain name
    
    # Unity WebGL game files (static)
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Unity WebGL specific MIME types
    location ~* \.wasm$ {
        root /var/www/html;
        add_header Content-Type application/wasm;
        add_header Content-Encoding br;
    }

    location ~* \.br$ {
        root /var/www/html;
        add_header Content-Encoding br;
        gzip off;
        
        location ~* \.wasm\.br$ {
            add_header Content-Type application/wasm;
        }
        location ~* \.js\.br$ {
            add_header Content-Type application/javascript;
        }
        location ~* \.data\.br$ {
            add_header Content-Type application/octet-stream;
        }
    }

    # Backend API routes
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # CORS headers (if needed)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json application/wasm;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/game-server-access.log;
    error_log /var/log/nginx/game-server-error.log;
}

