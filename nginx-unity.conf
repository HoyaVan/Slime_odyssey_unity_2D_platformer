server {
    listen 80;
    server_name _;  # Replace with your domain name or IP
    
    root /var/www/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json application/wasm;

    # Unity WebGL specific MIME types
    location ~* \.wasm$ {
        add_header Content-Type application/wasm;
        add_header Content-Encoding br;
    }

    location ~* \.br$ {
        # Brotli compressed files
        add_header Content-Encoding br;
        gzip off;  # Don't double compress
        
        # Set appropriate content type based on file extension
        location ~* \.wasm\.br$ {
            add_header Content-Type application/wasm;
        }
        location ~* \.js\.br$ {
            add_header Content-Type application/javascript;
        }
        location ~* \.data\.br$ {
            add_header Content-Type application/octet-stream;
        }
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/unity-game-access.log;
    error_log /var/log/nginx/unity-game-error.log;
}

